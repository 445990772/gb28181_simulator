<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB28181 设备模拟器 - Web配置界面</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 GB28181 设备模拟器</h1>
            <p class="subtitle">Web配置界面 - 支持Python和Java版本</p>
        </header>

        <div class="backend-selector">
            <label>选择后端服务：</label>
            <select id="backendType">
                <option value="python">Python版本</option>
                <option value="java">Java版本</option>
            </select>
            <button id="checkBackend" class="btn btn-secondary">检查后端连接</button>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="statusText">未连接</span>
        </div>

        <div class="config-section">
            <h2>📋 配置参数</h2>
            <form id="configForm">
                <div class="form-group">
                    <label for="serverIp">GB28181平台服务器IP：</label>
                    <input type="text" id="serverIp" value="192.168.32.84" required>
                </div>

                <div class="form-group">
                    <label for="serverPort">服务器端口：</label>
                    <input type="number" id="serverPort" value="8809" required>
                </div>

                <div class="form-group">
                    <label for="password">设备密码：</label>
                    <input type="text" id="password" value="123456" required>
                </div>

                <div class="form-group">
                    <label for="deviceCount">设备数量：</label>
                    <input type="number" id="deviceCount" value="3" min="1" max="100" required>
                </div>

                <div class="form-group">
                    <label for="channelCount">每设备通道数：</label>
                    <input type="number" id="channelCount" value="3" min="1" max="10" required>
                </div>

                <div class="form-group">
                    <label for="baseDeviceId">设备ID前缀：</label>
                    <input type="text" id="baseDeviceId" value="3402000000132000" required>
                    <small>设备ID格式：前缀 + 4位序号（如：34020000001320000001）</small>
                </div>

                <div class="form-group">
                    <label for="basePort">起始端口：</label>
                    <input type="number" id="basePort" value="15060" min="1024" max="65535" required>
                    <small>每个设备使用一个端口，从起始端口递增</small>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="startBtn">启动模拟器</button>
                    <button type="button" class="btn btn-danger" id="stopBtn" disabled>停止模拟器</button>
                    <button type="button" class="btn btn-info" id="statusBtn">查看状态</button>
                </div>
            </form>
        </div>

        <div class="log-section">
            <h2>📊 运行日志</h2>
            <div class="log-controls">
                <button class="btn btn-small" id="clearLogBtn">清空日志</button>
                <button class="btn btn-small" id="autoScrollBtn">自动滚动</button>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">等待操作...</div>
            </div>
        </div>

        <div class="system-resources-section" id="systemResourcesSection">
            <h2>💻 硬件资源统计</h2>
            <div class="resources-grid">
                <div class="resource-card">
                    <h3>CPU使用率</h3>
                    <div class="resource-value">
                        <span id="cpuPercent">0</span>%
                    </div>
                    <div class="resource-info">
                        <span>核心数: <span id="cpuCount">0</span></span>
                    </div>
                    <div class="chart-wrapper-small">
                        <canvas id="cpuChart"></canvas>
                    </div>
                </div>
                
                <div class="resource-card">
                    <h3>内存使用</h3>
                    <div class="resource-value">
                        <span id="memoryPercent">0</span>%
                    </div>
                    <div class="resource-info">
                        <span>已用: <span id="memoryUsed">0</span> MB</span>
                        <span>可用: <span id="memoryAvailable">0</span> MB</span>
                    </div>
                    <div class="chart-wrapper-small">
                        <canvas id="memoryChart"></canvas>
                    </div>
                </div>
                
                <div class="resource-card">
                    <h3>网络流量</h3>
                    <div class="resource-value">
                        <span id="networkSent">0</span> KB/s
                    </div>
                    <div class="resource-info">
                        <span>发送: <span id="networkBytesSent">0</span> MB</span>
                        <span>接收: <span id="networkBytesRecv">0</span> MB</span>
                    </div>
                    <div class="chart-wrapper-small">
                        <canvas id="networkChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="device-list-section" id="deviceListSection" style="display: none;">
            <h2>📱 设备列表</h2>
            <p style="color: #6c757d; margin-bottom: 15px;">点击设备卡片查看详情（监控数据和消息）</p>
            <div id="deviceList"></div>
        </div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
